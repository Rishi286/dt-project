apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dt-worker
  template:
    metadata:
      labels:
        app: dt-worker
    spec:
      containers:
      - name: worker
        image: dt-worker:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
